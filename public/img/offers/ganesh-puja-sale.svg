     role="presentation" aria-hidden="true">
  <!-- FloralforU campaign artwork — festive / puja season.
       Decorative only: the campaign title, its discount badge and the live
       countdown are real text laid over and beside this, so the art carries no
       words of its own — a banner that repeats the title is what made the old
       placeholder read as a template.
       It is displayed object-cover at 16/6 and as narrow as 16/9, which crops
       to the central ~62%, so everything load-bearing sits between x=230 and
       x=970, and both top corners stay quiet under the badge and countdown. -->
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#ffefd8"/>
      <stop offset="1" stop-color="#fde3cf"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.68" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="mari">

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Local SQLite file, recreated from migrations on every run.
      DATABASE_URL: file:./dev.db
      # Not a secret: a throwaway value so the session signer has the 32+
      # characters it requires. Production sets a real one via the host's env.
      AUTH_SECRET: ci-only-throwaway-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, so the client is ready after this.
      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed the database
        run: npm run seed

      - name: Lint
        run: npx eslint src

      # `next typegen` first: LayoutProps and friends are generated types, and on
      # a clean checkout they do not exist until a build or typegen has run.
      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Drives the production build: all public pages at three widths, the
      # Enquire links, every filter and sort, and the admin round-trips.
      - name: Browser tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
